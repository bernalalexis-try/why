name: Bug Report
description: Create a report to help us fix a diagnostic or causal reasoning defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in `why`!
  - type: textarea
    id: command
    attributes:
      label: Command Executed
      description: What exact command did you run?
      placeholder: why ssh user@host --deep
    validations:
      required: true
  - type: textarea
    id: actual_output
    attributes:
      label: Actual Output
      description: What output or error did `why` produce? (Please paste terminal output or JSON)
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected_output
    attributes:
      label: Expected Behavior / Causal Explanation
      description: What was the actual root cause that `why` missed or misidentified?
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: Operating System & Architecture
      placeholder: macOS 15.0 arm64 / Ubuntu 24.04 x86_64
    validations:
      required: true
  - type: input
    id: why_version
    attributes:
      label: why version
      placeholder: why version 0.1.0
    validations:
      required: true
